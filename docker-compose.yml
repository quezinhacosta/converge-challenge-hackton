services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitai-backend
    ports:
      - "8000:8000"
    environment:
      - FEATHERLESS_API_BASE=https://api.featherless.ai/v1
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - FEATHERLESS_MODEL=meta-llama/Meta-Llama-3.1-8B-Instruct
      - VYTAI_MODE=demo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
