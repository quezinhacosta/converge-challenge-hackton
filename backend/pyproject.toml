[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-backend"
version = "0.1.0"
description = "Pulso: Digital Worker de Gestao de Riscos Psicossociais (NR-1) para o RH"
authors = [
    { name = "Time Booleanas" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0,<1",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "strands-agents[openai]>=1.64.0",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "pypdf>=6,<7"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pytest>=8.2.0",
    "httpx>=0.27.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP"
]
ignore = [
    "E501",  # line length permitido em docstrings e descricoes textuais longas
    "B008",  # Depends() padrao do FastAPI em assinaturas de endpoint
    "B904",  # raise HTTPException em endpoints da camada de apresentacao
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
