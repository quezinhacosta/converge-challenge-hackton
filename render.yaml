services:
  - type: web
    name: pulso-backend
    runtime: python
    plan: free
    branch: feature/strands-agents
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.presentation.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PULSO_LLM_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: PULSO_CORS_ORIGINS
        sync: false
